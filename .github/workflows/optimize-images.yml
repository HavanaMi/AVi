name: Optimize AVi images to WebP

on:
  push:
    branches: [main]
    paths:
      - 'assets/uploads/**'
      - 'scripts/optimize_images.py'
      - '.github/workflows/optimize-images.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: optimize-avi-images
  cancel-in-progress: false

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image converters
        run: python -m pip install --disable-pip-version-check 'Pillow>=11,<13' 'PyMuPDF>=1.24,<2'
      - name: Convert images and cover PDFs to WebP
        run: python scripts/optimize_images.py
      - name: Commit generated previews
        run: |
          git add images/optimized/
          if git diff --cached --quiet; then
            echo "No updated images"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Generate optimized WebP previews"
          git push
